<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<title>SchedMaster — Log in</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet" type="text/css" />
<link href="theme.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen flex items-center justify-center py-6 px-3">

<div class="w-full max-w-md">
<div class="text-center mb-4"><span class="wordmark" style="font-size:1.6rem"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1f6b41" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>SchedMaster</span><div class="text-sm" style="color:var(--ink-soft)">Class schedules, made simple</div></div>
<div x-data="authForm()" x-init="init()" class="card w-full">
  <div class="card-body">

    <div class="tabs tabs-boxed mb-2">
      <a class="tab" :class="mode === 'login' ? 'tab-active' : ''" @click="setMode('login')">Log in</a>
      <a class="tab" :class="mode === 'register' ? 'tab-active' : ''" @click="setMode('register')">Sign up</a>
    </div>

    <h2 class="card-title" x-text="mode === 'login' ? 'Welcome back' : 'Create your account'"></h2>

    <!-- Who are you? (sign-up only) -->
    <div x-show="mode === 'register'" class="mb-1">
      <div class="text-sm opacity-70 mb-1">I am a…</div>
      <div class="grid grid-cols-3 gap-2">
        <button type="button" class="btn btn-sm" :class="role === 'teacher' ? 'btn-primary' : 'btn-outline'" @click="setRole('teacher')">👩‍🏫 Teacher</button>
        <button type="button" class="btn btn-sm" :class="role === 'student' ? 'btn-primary' : 'btn-outline'" @click="setRole('student')">🎓 Student</button>
        <button type="button" class="btn btn-sm" :class="role === 'admin' ? 'btn-primary' : 'btn-outline'" @click="setRole('admin')">🛠 Admin</button>
      </div>
      <p class="text-xs opacity-60 mt-2" x-show="role === 'admin'">Admins build and manage schedules.</p>
      <p class="text-xs opacity-60 mt-2" x-show="role !== 'admin'">Ask your admin for the <strong>join code</strong>.
        <span x-show="role === 'student' && school && studentAuto">You'll get in right away.</span>
        <span x-show="!(role === 'student' && school && studentAuto)">Your admin will approve your account before you can log in.</span></p>
    </div>

    <div x-show="errorMsg" x-text="errorMsg" class="alert alert-error text-sm py-2"></div>
    <div x-show="okMsg" x-text="okMsg" class="alert alert-success text-sm py-2"></div>

    <form @submit.prevent="submit">

      <!-- Teacher / student: join code + pick yourself -->
      <div x-show="mode === 'register' && role !== 'admin'">
        <div class="form-control mb-2">
          <label class="label"><span class="label-text">Join code</span></label>
          <div class="flex gap-2">
            <input x-model="joinCode" @input.debounce.400ms="lookup()" type="text" maxlength="12"
                   class="input input-bordered flex-1 min-w-0 uppercase tracking-widest" placeholder="e.g. K7M2QX9A">
            <button type="button" class="btn btn-outline shrink-0" @click="lookup()">Check</button>
          </div>
          <label class="label" x-show="school"><span class="label-text-alt text-success" x-text="'✓ ' + school"></span></label>
        </div>

        <div class="form-control mb-2" x-show="school && role === 'teacher'">
          <label class="label"><span class="label-text">Your name on the schedule</span></label>
          <select x-model="instructorId" @change="pickInstructor()" class="select select-bordered">
            <option value="">Select your name…</option>
            <template x-for="i in instructors" :key="i.id">
              <option :value="i.id" :disabled="i.taken" x-text="i.name + (i.taken ? ' (already has an account)' : '')"></option>
            </template>
          </select>
        </div>

        <div class="form-control mb-2" x-show="school && role === 'student'">
          <label class="label"><span class="label-text">Your section</span></label>
          <select x-model="sectionId" class="select select-bordered">
            <option value="">Select your section…</option>
            <template x-for="s in sections" :key="s.id">
              <option :value="s.id" x-text="s.section_name"></option>
            </template>
          </select>
        </div>
      </div>

      <div x-show="mode === 'register'" class="form-control mb-2">
        <label class="label"><span class="label-text">Full name</span></label>
        <input x-model="name" type="text" autocomplete="name" class="input input-bordered" placeholder="Juan Dela Cruz">
      </div>

      <div class="form-control mb-2">
        <label class="label"><span class="label-text">Email</span></label>
        <input x-model="email" type="email" autocomplete="email" inputmode="email" class="input input-bordered" placeholder="you@school.edu.ph" required>
      </div>

      <div class="form-control mb-4">
        <label class="label"><span class="label-text">Password</span></label>
        <input x-model="password" type="password" :autocomplete="mode === 'login' ? 'current-password' : 'new-password'" class="input input-bordered" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary w-full" :disabled="loading">
        <span x-show="loading" class="loading loading-spinner loading-sm"></span>
        <span x-text="mode === 'login' ? 'Log In' : (role === 'admin' ? 'Create admin account' : (role === 'student' && studentAuto ? 'Join' : 'Request access'))"></span>
      </button>
    </form>

  </div>
</div>
</div>

<script>
function authForm() {
  return {
    mode: 'login', role: 'teacher',
    name: '', email: '', password: '',
    joinCode: '', school: '', studentAuto: false, instructors: [], sections: [], instructorId: '', sectionId: '',
    loading: false, errorMsg: '', okMsg: '',

    init() {
      // An invite link (…login.html?join=CODE) opens the sign-up form with the code filled in.
      const code = new URLSearchParams(location.search).get('join');
      if (code) { this.mode = 'register'; this.joinCode = code.toUpperCase(); this.lookup(); }
    },

    setMode(m) { this.mode = m; this.errorMsg = ''; this.okMsg = ''; },
    setRole(r) { this.role = r; this.errorMsg = ''; },

    async lookup() {
      const code = this.joinCode.trim().toUpperCase();
      this.school = ''; this.instructors = []; this.sections = []; this.instructorId = ''; this.sectionId = '';
      if (code.length < 6) return;
      try {
        const res = await fetch('../api/join_info.php?code=' + encodeURIComponent(code));
        const data = await res.json();
        if (!res.ok) { this.errorMsg = data.error || 'Invalid join code.'; return; }
        this.errorMsg = '';
        this.school = data.school_name;
        this.studentAuto = !!data.student_auto_approve;
        this.instructors = data.instructors;
        this.sections = data.sections;
      } catch (e) { this.errorMsg = 'Could not reach the server.'; }
    },

    pickInstructor() {
      const i = this.instructors.find(x => String(x.id) === String(this.instructorId));
      if (i && !this.name) this.name = i.name;
    },

    async submit() {
      this.loading = true; this.errorMsg = ''; this.okMsg = '';
      const isLogin = this.mode === 'login';
      const payload = isLogin
        ? { email: this.email, password: this.password }
        : { role: this.role, name: this.name, email: this.email, password: this.password,
            join_code: this.joinCode.trim().toUpperCase(), instructor_id: this.instructorId, section_id: this.sectionId };
      try {
        const res = await fetch(isLogin ? '../api/login.php' : '../api/register.php', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) {
          this.errorMsg = data.error || 'Something went wrong.';
        } else if (data.pending) {
          // Teacher/student request sent: they can log in once the admin approves.
          this.mode = 'login'; this.password = '';
          this.okMsg = 'Request sent! You can log in as soon as your admin approves your account.';
        } else {
          window.location.href = data.home || 'dashboard.html';
        }
      } catch (err) {
        this.errorMsg = 'Could not reach the server.';
      } finally {
        this.loading = false;
      }
    }
  }
}
</script>

</body>
</html>
